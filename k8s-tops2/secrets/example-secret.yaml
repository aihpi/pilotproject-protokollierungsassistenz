# tops2 needs its OWN secret in namespace tops2. The existing tops SealedSecret
# CANNOT be reused: SealedSecret ciphertext is scoped to {namespace, name}, so the
# tops/tops-secret blob will not decrypt as tops2/tops2-secret.
#
# Option A (quick, you have cluster access): apply a plain Secret out-of-band:
#   kubectl create namespace tops2
#   kubectl create secret generic tops2-secret -n tops2 \
#     --from-literal=LLM_API_KEY=sk-...your-litellm-key...
#
# Option B (GitOps): seal the key for this namespace/name and commit it as
# secrets/sealed-secret.yaml, then uncomment that line in kustomization.yaml:
#   kubectl create secret generic tops2-secret -n tops2 \
#     --from-literal=LLM_API_KEY=sk-... --dry-run=client -o yaml \
#     | kubeseal --format yaml > secrets/sealed-secret.yaml
#
# This file is only a template — do not commit a real key here.
apiVersion: v1
kind: Secret
metadata:
  name: tops2-secret
  namespace: tops2
type: Opaque
stringData:
  LLM_API_KEY: "YOUR_LITELLM_SK_KEY_HERE"
