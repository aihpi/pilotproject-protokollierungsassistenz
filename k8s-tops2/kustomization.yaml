apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tops2

resources:
  - namespace.yaml
  - backend/configmap.yaml
  - backend/deployment.yaml
  - backend/service.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  # The tops2 LLM_API_KEY secret is provided out-of-band (see secrets/README.md).
  # For GitOps, seal the key for namespace tops2 / name tops2-secret, drop the file
  # at secrets/sealed-secret.yaml, and uncomment the next line:
  # - secrets/sealed-secret.yaml
