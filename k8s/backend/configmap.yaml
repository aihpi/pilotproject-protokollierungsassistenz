apiVersion: v1
kind: ConfigMap
metadata:
  name: tops-backend-config
data:
  WHISPER_MODEL: "large-v2"
  WHISPER_DEVICE: "cuda"
  WHISPER_BATCH_SIZE: "16"
  WHISPER_LANGUAGE: "de"
  LLM_BASE_URL: "https://api.aisc.hpi.de"
  LLM_MODEL: "llama-3-3-70b"
  # LoRA adapter served by the LiteLLM hub for the "Landtagstil" configuration
  # (results/20260902-31b_cap48k in pilotproject-automatic-protocols, r8, cap 49152).
  GEMMA_MODEL: "gemma-4-31b-protokoll"
